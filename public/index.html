<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<meta name="description" content="Portfolio of an IT Infrastructure Engineer">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="nav">
  <a class="brand" href="#top" id="brand">Portfolio</a>
  <nav>
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#projects">Projects</a>
    <a href="#experience">Experience</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main id="top">
  <section class="hero">
    <p class="kicker" id="hero-location"></p>
    <h1 id="hero-name"></h1>
    <h2 id="hero-title"></h2>
    <p class="tagline" id="hero-tagline"></p>
    <div class="hero-links" id="hero-links"></div>
  </section>

  <section id="about" class="block">
    <h3 class="section-title">About</h3>
    <div id="about-body" class="prose"></div>
  </section>

  <section id="skills" class="block">
    <h3 class="section-title">Skills</h3>
    <div id="skills-grid" class="skills-grid"></div>
  </section>

  <section id="projects" class="block">
    <h3 class="section-title">Projects</h3>
    <div id="projects-grid" class="projects-grid"></div>
  </section>

  <section id="experience" class="block">
    <h3 class="section-title">Experience</h3>
    <div id="experience-list"></div>
  </section>

  <section id="contact" class="block">
    <h3 class="section-title" id="contact-heading">Contact</h3>
    <p id="contact-text" class="prose"></p>
    <div class="hero-links" id="contact-links"></div>
  </section>
</main>

<footer>
  <p id="footer-line">© 2026</p>
</footer>

<script src="app.js"></script>
</body>
</html>
